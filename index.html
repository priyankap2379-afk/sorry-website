<!DOCTYPE html>
<html>
<head>
<title>For You ❤️</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
font-family:Arial;
background:linear-gradient(135deg,#ffd6e7,#f8e8ff,#d9f4ff);
overflow:hidden;
}

h1{
font-size:48px;
color:white;
text-shadow:0 0 10px hotpink,
0 0 20px hotpink,
0 0 40px hotpink;
animation:glow 2s infinite alternate;
}

p{
margin-top:20px;
font-size:22px;
color:white;
text-align:center;
padding:20px;
}

button{
margin-top:40px;
padding:18px 40px;
font-size:22px;
border:none;
border-radius:50px;
background:#ff4f8b;
color:white;
box-shadow:0 0 20px #ff4f8b;
cursor:pointer;
}

button:hover{
transform:scale(1.05);
}

@keyframes glow{

from{
text-shadow:0 0 10px hotpink;
}

to{
text-shadow:0 0 30px hotpink,
0 0 60px hotpink;
}

}
</style>

</head>

<body>

<h1>I'm Sorry ❤️</h1>

<p>
Someone very special means a lot to me...
<br><br>
I made a mistake.
<br><br>
This website is only for you.
</p>

<button>Tap To Begin 🌸</button>

</body>
</html>
