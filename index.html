<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>For You ❤️</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}

body{
height:100vh;
overflow:hidden;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(
180deg,
#0f1021,
#1c1c3c,
#2a2a54
);
}

.container{
text-align:center;
padding:20px;
z-index:2;
}

h1{
color:white;
font-size:42px;
margin-bottom:20px;
text-shadow:
0 0 10px #ff7bd5,
0 0 20px #ff7bd5,
0 0 40px #ff7bd5;
animation:glow 2s infinite alternate;
}

p{
color:#ffe6f4;
font-size:20px;
margin-bottom:40px;
}

button{
padding:18px 40px;
font-size:20px;
border:none;
border-radius:50px;
background:#ff4fa2;
color:white;
box-shadow:
0 0 20px #ff4fa2,
0 0 40px #ff4fa2;
}

.star{
position:absolute;
background:white;
border-radius:50%;
animation:twinkle 3s infinite;
}

.star:nth-child(1){
top:10%;
left:20%;
width:3px;
height:3px;
}

.star:nth-child(2){
top:25%;
left:80%;
width:4px;
height:4px;
}

.star:nth-child(3){
top:70%;
left:15%;
width:3px;
height:3px;
}

.star:nth-child(4){
top:60%;
left:90%;
width:5px;
height:5px;
}

.star:nth-child(5){
top:40%;
left:45%;
width:4px;
height:4px;
}

@keyframes glow{

from{
text-shadow:
0 0 10px #ff7bd5;
}

to{
text-shadow:
0 0 20px #ff7bd5,
0 0 40px #ff7bd5,
0 0 60px #ff7bd5;
}

}

@keyframes twinkle{

0%{
opacity:.2;
}

50%{
opacity:1;
}

100%{
opacity:.2;
}

}

</style>
</head>

<body>

<div class="star"></div>
<div class="star"></div>
<div class="star"></div>
<div class="star"></div>
<div class="star"></div>

<div class="container">

<h1>Someone Has Something To Tell You ❤️</h1>

<p>Tap below to begin...</p>

<button>Tap To Begin ✨</button>

</div>

</body>
</html>
